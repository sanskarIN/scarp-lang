name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  stable:
    name: Stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Validate source and examples
        shell: bash
        run: sh scripts/check.sh --offline
      - name: Smoke-test benchmark workloads
        run: cargo bench --locked --offline --bench runtime -- --quick
      - name: Verify release asset validation
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'
      - name: Validate PowerShell check script
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1 -Offline

  minimum:
    name: Minimum Rust / 1.74.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.74.0
      - name: Test minimum toolchain
        run: cargo test --locked --offline
      - name: Build minimum toolchain
        run: cargo build --locked --offline
      - name: Test release mode on minimum Rust
        run: cargo test --locked --offline --release
      - name: Smoke-test benchmark on minimum Rust
        run: cargo bench --locked --offline --bench runtime -- --quick
